      <path d="M96 126 L101 238 Q103 254 120 254 H200 Q217 254 219 238 L224 126" fill="none"/>

      <!-- rim and cold coffee -->
      <ellipse cx="160" cy="126" rx="64" ry="14" fill="#c99d48"/>
      <ellipse cx="160" cy="127" rx="53" ry="9" fill="#1d1410" stroke="none"/>
