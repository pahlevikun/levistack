<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="240" height="240" role="img" aria-labelledby="t d">
  <title id="t">Levi, the levistack mascot</title>
  <desc id="d">A mug built from a stack of three muted layers, leaning a little as if too tired to stand straight. Its handle is a fish hook. The mug floats with no ground shadow, inside a soft, uneven fog of dusky blue and purple, a gloomy, bored mood with no face.</desc>
  <defs>
    <clipPath id="mug">
      <path d="M96 126 L101 238 Q103 254 120 254 H200 Q217 254 219 238 L224 126 Z"/>
    </clipPath>
    <filter id="fog" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <filter id="mist" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- gloomy, bored aura: uneven fog hanging around a floating mug -->
  <g filter="url(#fog)">
    <ellipse cx="162" cy="168" rx="100" ry="94" fill="#4a4f7a" fill-opacity=".52"/>
    <ellipse cx="132" cy="196" rx="78" ry="64" fill="#3a3358" fill-opacity=".5"/>
    <ellipse cx="206" cy="118" rx="58" ry="48" fill="#566782" fill-opacity=".34"/>
  </g>
  <g filter="url(#mist)">
    <ellipse cx="108" cy="100" rx="32" ry="18" fill="#6a6fa0" fill-opacity=".28"/>
    <ellipse cx="226" cy="228" rx="38" ry="22" fill="#5a5f8e" fill-opacity=".3"/>
  </g>

  <g stroke="#17152e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">

