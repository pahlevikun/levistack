<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 256" width="904" height="256" fill="none" role="img" aria-label="levistack, for people tired of AI slop">
  <defs>
    <clipPath id="batile"><rect x="2" y="2" width="132" height="132" rx="30"/></clipPath>
    <clipPath id="bamug"><path d="M96 126 L101 238 Q103 254 120 254 H200 Q217 254 219 238 L224 126 Z"/></clipPath>
    <filter id="bafog" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="17"/></filter>
    <filter id="bamist" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
    <style>
      .float { transform-origin: 160px 190px; animation: murk-float 6s ease-in-out infinite; }
      .fog-drift { animation: murk-drift 6s ease-in-out infinite; }
      .steam { stroke-dasharray: 80; animation: murk-steam 6s ease-out infinite; }
      .glint { animation: murk-glint 6s ease-in-out infinite; }
      @keyframes murk-float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-7px) rotate(-2deg); } }
      @keyframes murk-drift { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
      @keyframes murk-steam {
        0% { stroke-dashoffset: 80; opacity: 0; transform: translateY(0); }
        28% { stroke-dashoffset: 0; opacity: 1; transform: translateY(0); }
        58% { stroke-dashoffset: 0; opacity: 1; transform: translateY(-3px); }
        78% { stroke-dashoffset: 0; opacity: 0; transform: translateY(-10px); }
        100% { stroke-dashoffset: 80; opacity: 0; transform: translateY(0); }
      }
      @keyframes murk-glint { 0%, 40%, 100% { stroke-opacity: .35; } 52% { stroke-opacity: 1; } 64% { stroke-opacity: .35; } }
      .cursor-block { animation: murk-blink 1.1s steps(2, start) infinite; }
      @keyframes murk-blink { to { visibility: hidden; } }
      .spine { stroke-dasharray: 112; animation: murk-spine 6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      @keyframes murk-spine { 0% { stroke-dashoffset: 112; } 40%, 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 112; } }
      .step { animation: murk-step 6s ease-in-out infinite; }
      .s1 { animation-delay: 0.00s; }
      .s2 { animation-delay: 0.32s; }
      .s3 { animation-delay: 0.64s; }
      .s4 { animation-delay: 0.96s; }
      .s5 { animation-delay: 1.28s; }
      .s6 { animation-delay: 1.60s; }
      .s7 { animation-delay: 1.92s; }
      @keyframes murk-step { 0%, 100% { fill: #6a6fa0; } 12%, 88% { fill: #98a2b6; } }
      .s6 { animation-name: murk-step-gold; }
      @keyframes murk-step-gold { 0%, 100% { fill: #6a6fa0; } 12%, 88% { fill: #c99d48; } }
      .prove-row { animation: murk-prove 6s ease-in-out infinite; }
      @keyframes murk-prove { 0%, 30%, 100% { stroke-opacity: .35; } 44%, 88% { stroke-opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; transform: none !important; }
      }
    </style>
  </defs>
  <rect x="2" y="2" width="900" height="252" rx="18" fill="#17152e" stroke="#3a3358" stroke-width="2"/>

  <g transform="translate(28, 60)">
