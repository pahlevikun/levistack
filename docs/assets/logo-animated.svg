      <path d="M96 126 L101 238 Q103 254 120 254 H200 Q217 254 219 238 L224 126" fill="none"/>

      
          <path d="M96 126 L101 238 Q103 254 120 254 H200 Q217 254 219 238 L224 126" fill="none"/>
