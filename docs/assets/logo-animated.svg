  <text x="184" y="106" font-family="IBM Plex Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.6"><tspan fill="#e8e4f4">levi</tspan><tspan fill="#c99d48">stack</tspan></text>
  <rect class="cursor-block" x="345" y="78" width="10" height="30" rx="2" fill="#c99d48" opacity="0.85"/>
  <text x="186" y="134" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="500" fill="#98a2b6">for people tired of AI slop.</text>
  <g transform="translate(186, 152)" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">
    <rect x="0" y="0" width="118" height="26" rx="6" fill="#3a3358" stroke="#b2853a" stroke-width="1.2"/>
    <circle cx="13" cy="13" r="3.5" fill="#c99d48"/>
    <text x="23" y="17" fill="#e8e4f4">skill catalog</text>
    <rect x="126" y="0" width="130" height="26" rx="6" fill="#3a3358" stroke="#3c7f7c" stroke-width="1.2"/>
    <text x="136" y="17" fill="#c6cddb">proof before done</text>
  </g>
  <text x="186" y="200" font-family="IBM Plex Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" fill="#6a6fa0">Meet Murk: overskilled and underslept.</text>

  <g transform="translate(456, 22)">
    <rect x="0" y="0" width="424" height="212" rx="12" fill="#3a3358" stroke="#4a4f7a" stroke-width="1.5"/>
    <path d="M 0 12 A 12 12 0 0 1 12 0 H 412 A 12 12 0 0 1 424 12 V 36 H 0 Z" fill="#4a4f7a"/>
    <line x1="0" y1="36" x2="424" y2="36" stroke="#566782" stroke-width="1.2"/>
    <circle cx="16" cy="18" r="4" fill="#66589a"/>
    <circle cx="30" cy="18" r="4" fill="#3c7f7c"/>
    <circle cx="44" cy="18" r="4" fill="#c99d48"/>
    <rect x="62" y="8" width="172" height="20" rx="5" fill="#17152e" stroke="#b2853a" stroke-width="1"/>
    <circle cx="73" cy="18" r="3" fill="#c99d48"/>
    <text x="82" y="22" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" fill="#c99d48">/use-levistack &lt;task&gt;</text>
    <text x="352" y="22" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#98a2b6">7 steps</text>
    <line class="spine" x1="24" y1="48" x2="24" y2="160" stroke="#566782" stroke-width="2" stroke-linecap="round"/>
    <g font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      <circle class="step s1" cx="24" cy="48" r="4" fill="#98a2b6"/>
      <text x="38" y="52" fill="#e8e4f4" font-weight="600">01 route</text>
      <text x="124" y="52" fill="#98a2b6" font-size="10.5">takes your task, or a skill you name</text>
      <circle class="step s2" cx="24" cy="66" r="4" fill="#98a2b6"/>
      <text x="38" y="70" fill="#e8e4f4" font-weight="600">02 prime</text>
      <text x="124" y="70" fill="#98a2b6" font-size="10.5">reads the ask, never rewrites it</text>
      <circle class="step s3" cx="24" cy="84" r="4" fill="#98a2b6"/>
      <text x="38" y="88" fill="#e8e4f4" font-weight="600">03 invoke</text>
      <text x="124" y="88" fill="#98a2b6" font-size="10.5">picks the first skill</text>
      <circle class="step s4" cx="24" cy="102" r="4" fill="#98a2b6"/>
      <text x="38" y="106" fill="#e8e4f4" font-weight="600">04 hunt</text>
      <text x="124" y="106" fill="#98a2b6" font-size="10.5">searches the catalog when unsure</text>
      <circle class="step s5" cx="24" cy="120" r="4" fill="#98a2b6"/>
      <text x="38" y="124" fill="#e8e4f4" font-weight="600">05 apply</text>
      <text x="124" y="124" fill="#98a2b6" font-size="10.5">runs the chain, one skill at a time</text>
      <rect class="prove-row" x="10" y="130" width="404" height="18" rx="4" fill="#17152e" stroke="#b2853a" stroke-width="1"/>
      <circle class="step s6" cx="24" cy="138" r="4" fill="#c99d48"/>
      <text x="38" y="142" fill="#c99d48" font-weight="600">06 prove</text>
      <text x="124" y="142" fill="#c99d48" font-size="10.5">fresh proof, then your yes</text>
      <circle class="step s7" cx="24" cy="156" r="4" fill="#98a2b6"/>
      <text x="38" y="160" fill="#e8e4f4" font-weight="600">07 deliver</text>
      <text x="124" y="160" fill="#98a2b6" font-size="10.5">plain words, then the last gate</text>
    </g>
    <line x1="0" y1="180" x2="424" y2="180" stroke="#566782" stroke-width="1.2"/>
    <g font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600">
      <text x="18" y="200" fill="#98a2b6">catalog &#183; agents &#183; rules &#183; hooks</text>
      <text x="336" y="200" fill="#c99d48">+2 upstream</text>
    </g>
  </g>
