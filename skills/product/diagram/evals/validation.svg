<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="validation-title validation-desc">
  <title id="validation-title">Request validation</title>
  <desc id="validation-desc">Fictional example. A client submits to validation. A valid request is stored. An invalid request is rejected.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#17212b"/></marker></defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <g fill="#17212b" font-family="Arial, sans-serif"><text x="40" y="45" font-size="28" font-weight="700">Request validation</text><text x="40" y="75" font-size="18">Fictional example</text></g>
  <g fill="none" stroke="#17212b" stroke-width="2" marker-end="url(#arrow)"><path d="M210 145H310"/><path d="M470 145H570"/><path d="M390 180V260"/></g>
  <g fill="#17212b" font-family="Arial, sans-serif" font-size="18"><text x="230" y="130">submit</text><text x="510" y="130">yes</text><text x="410" y="235">no</text></g>
  <g fill="#f4f7fa" stroke="#17212b" stroke-width="2"><rect id="client" x="50" y="110" width="160" height="70" rx="6"/><path id="gate" d="M390 110L470 145L390 180L310 145Z"/><rect id="store" x="570" y="110" width="160" height="70" rx="6"/><rect id="reject" x="310" y="260" width="160" height="70" rx="6"/></g>
  <g fill="#17212b" font-family="Arial, sans-serif" font-size="22" text-anchor="middle"><text x="130" y="153">Client</text><text x="390" y="153">Valid?</text><text x="650" y="153">Store</text><text x="390" y="303">Reject</text></g>
  <text x="40" y="375" fill="#17212b" font-family="Arial, sans-serif" font-size="17">Yes stores the request. No rejects it.</text>
</svg>
